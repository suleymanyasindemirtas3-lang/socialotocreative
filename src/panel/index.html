<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>socialotocreative</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --ink:#12151a; --muted:#6b7480; --line:#e2e6ea;
    --accent:#2f6fed; --ok:#12855a; --warn:#a8690b; --bad:#c33f38; --chip:#eef1f5;
    --yildiz:#e0a33c;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0f1216; --card:#171b21; --ink:#e8ecf1; --muted:#96a0ac; --line:#252b33;
           --accent:#5b8dfb; --ok:#3ec98d; --warn:#e0a33c; --bad:#f0736a; --chip:#212730; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);
         padding:10px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  h1{font-size:15px;margin:0;font-weight:650;letter-spacing:-.01em;cursor:pointer}
  h2{font-size:17px;margin:0 0 4px}
  .grow{flex:1}
  .chip{background:var(--chip);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted);white-space:nowrap}
  .chip b{color:var(--ink);font-weight:600}
  button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);
         border-radius:8px;padding:7px 12px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.ok{color:var(--ok)} button.bad{color:var(--bad)}
  button.mini{padding:4px 9px;font-size:12px}
  /* Manuel paylasim kutusu: API'siz yayin akisi */
  a.btn{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);
        border-radius:8px;padding:4px 9px;cursor:pointer;text-decoration:none;display:inline-block}
  a.btn:hover{border-color:var(--accent)}
  .manuel{margin-top:12px;padding:14px;border:1px solid var(--accent);border-radius:10px;background:var(--bg)}
  .manuel ol{margin:10px 0 0 18px;padding:0;line-height:1.7}
  .manuel textarea{margin-top:8px}
  .manuel input{margin:0}
  .rozet{font-size:11px;padding:2px 7px;border-radius:99px;background:var(--chip);color:var(--warn);
         border:1px solid var(--line);white-space:nowrap}
  .rozet.ok{color:var(--ok)} .rozet.uyari{color:var(--bad)}
  /* Haber listesi: tek satirda karar verdirecek kadar bilgi, fazlasi degil. */
  .liste{display:flex;flex-direction:column;gap:8px}
  .satir{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);
         border-radius:12px;padding:12px 14px;cursor:pointer}
  .satir:hover{border-color:var(--accent)}
  .satir .yildizlar{min-width:74px}
  .satir .govde{flex:1;min-width:0}
  .satir .baslik{font-weight:600;line-height:1.35}
  .satir .altbilgi{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
  .satir .onizleme{color:var(--muted);font-size:12px;margin-top:6px;overflow:hidden;
                   text-overflow:ellipsis;white-space:nowrap}
  /* Sinif adi "ok" degil: .rozet.ok ile carpisiyordu ve rozetler 22px oluyordu. */
  .satir .cevron{color:var(--muted);font-size:22px;line-height:1}
  /* Ilerleme kutusu */
  .ilerleme{border-color:var(--accent)}
  .ilerleme .sayac{font-variant-numeric:tabular-nums;font-weight:600;color:var(--accent)}
  .ilerleme .cubuk{height:6px;border-radius:99px;background:var(--bg);overflow:hidden;margin:10px 0 12px;
                   border:1px solid var(--line)}
  .ilerleme .cubuk>div{height:100%;background:var(--accent);transition:width .4s ease}
  /* Calisirken cubuk uzerinde kayan parilti: sunucudan yanit gelmese de
     ekranin canli oldugu belli olsun. */
  .ilerleme .cubuk.canli{position:relative}
  .ilerleme .cubuk.canli::after{content:'';position:absolute;inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);
    animation:kay 1.4s linear infinite}
  @keyframes kay{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
  .ilerleme .adimlar{display:flex;flex-direction:column;gap:6px}
  .ilerleme .adim{display:flex;gap:8px;align-items:baseline;font-size:13px;flex-wrap:wrap}
  .ilerleme .adim .simge{min-width:14px}
  .ilerleme .adim.bekliyor .ad{color:var(--muted)}
  .ilerleme .adim.suruyor .ad{font-weight:600;color:var(--accent)}
  .ilerleme .adim .ozet{flex:1;min-width:0}
  .ilerleme .adim .sure{margin-left:auto;font-variant-numeric:tabular-nums}
  .donen{display:inline-block;width:11px;height:11px;border:2px solid var(--line);
         border-top-color:var(--accent);border-radius:50%;animation:don .7s linear infinite}
  @keyframes don{to{transform:rotate(360deg)}}
  main{max-width:1100px;margin:0 auto;padding:18px}
  nav{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
  nav button[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:#fff}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .muted{color:var(--muted)} .small{font-size:12px}
  .status{font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:650;padding:2px 8px;
          border-radius:999px;background:var(--chip)}
  .s-pending_approval{color:var(--warn)} .s-approved{color:var(--ok)} .s-published{color:var(--ok)}
  .s-failed{color:var(--bad)} .s-rejected{color:var(--bad)} .s-draft{color:var(--muted)}
  .s-scripted{color:var(--accent)}
  textarea{width:100%;min-height:80px;resize:vertical;font:inherit;padding:10px;border-radius:8px;
           border:1px solid var(--line);background:var(--bg);color:var(--ink)}
  input,select{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);
               background:var(--bg);color:var(--ink);width:100%}
  input.gizli{-webkit-text-security:disc;font-family:monospace;letter-spacing:.08em}
  input.gizli:focus{-webkit-text-security:none;letter-spacing:0}
  label{display:block;margin:10px 0 4px;font-size:12px;color:var(--muted)}
  .variant{border:1px solid var(--line);border-radius:10px;padding:10px;margin:10px 0}
  .variant h4{margin:0 0 6px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  img.preview,video.preview{max-width:190px;border-radius:10px;border:1px solid var(--line);display:block;margin-top:10px}

  .hesaplar{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
  .hesap{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer}
  .hesap:hover{border-color:var(--accent)}
  .hesap .ad{font-weight:650;font-size:15px}
  .hesap .plat{font-size:12px;color:var(--muted);margin-top:2px}
  .hesap .sayilar{display:flex;gap:14px;margin-top:12px;font-size:12px;color:var(--muted)}
  .hesap .sayilar b{color:var(--ink);font-size:15px;display:block}

  .yildizlar{color:var(--yildiz);letter-spacing:2px;font-size:15px}
  .yildizlar .bos{color:var(--line)}
  .puankutu{border:1px solid var(--line);border-radius:10px;padding:10px;margin:10px 0;background:var(--bg)}
  .sinyal{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;margin:3px 4px 0 0;background:var(--chip)}
  .sinyal.arti{color:var(--ok)} .sinyal.eksi{color:var(--bad)}

  .adaylar{display:none;margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
  .adaylar[data-acik]{display:block}
  .adaylar .ust{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  .adaylar .ust input{flex:1;min-width:170px}
  .izgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .aday{border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;background:var(--card)}
  .aday:hover{border-color:var(--accent)}
  .aday img{width:100%;height:100px;object-fit:cover;display:block}
  .aday .bilgi{padding:6px 8px;font-size:11px;color:var(--muted);line-height:1.35}

  table{width:100%;border-collapse:collapse}
  td,th{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{font-size:12px;color:var(--muted);font-weight:600}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
         padding:10px 18px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:80vw;z-index:9}
  #toast.on{opacity:1}
  .empty{text-align:center;color:var(--muted);padding:40px 0}
  code{background:var(--chip);padding:1px 5px;border-radius:4px;font-size:12px}
  .geri{background:none;border:none;color:var(--accent);padding:0;margin-bottom:10px}
</style>
</head>
<body>
<header>
  <h1 id="logo">socialotocreative</h1>
  <span class="chip">LLM <b id="c-llm">-</b></span>
  <span class="chip">DRY_RUN <b id="c-dry">-</b></span>
  <span class="chip">onay <b id="c-auto">-</b></span>
  <span class="grow"></span>
  <button data-stage="ideate">Fikir bul</button>
  <button class="primary" data-stage="run">Tam tur</button>
</header>

<main>
  <nav>
    <button id="tab-ana" aria-selected="true">Ana Sayfa</button>
    <button id="tab-kategoriler" aria-selected="false">Kategoriler</button>
    <button id="tab-ekipler" aria-selected="false">Ekipler</button>
    <button id="tab-hesaplar" aria-selected="false">Hesap Ekle</button>
  </nav>
  <!-- Uzun islerin ilerlemesi. Sekmelerin altinda sabit yer: hangi
       gorunumde olursan ol calisan is gorunur. Bkz. core/ilerleme.ts -->
  <div id="ilerleme" class="card ilerleme" hidden></div>
  <div id="view-ana"></div>
  <div id="view-kategoriler" hidden></div>
  <div id="view-ekipler" hidden></div>
  <div id="view-hesaplar" hidden></div>
</main>

<div id="toast"></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
let STATE = { posts: [], accounts: [], platforms: [], teams: [], plan: [], kategoriler: [], config: {} };

/* Gezinme: SECILI_HESAP null ise hesap listesi, doluysa o hesabin sayfasi. */
let SECILI_HESAP = null;
let SECILI_KATEGORI = null;
/* Acik olan postun id'si. null ise haber listesi gorunur. */
let SECILI_POST = null;

function toast(msg, ms = 2600) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('on'), ms);
}

async function call(path, body) {
  const res = await fetch(path, {
    method: body ? 'POST' : 'GET',
    headers: body ? { 'content-type': 'application/json' } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error || res.status);
  return j;
}

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const platformOf = (id) => STATE.platforms.find((p) => p.id === id);
const accountOf = (id) => STATE.accounts.find((a) => a.id === id);
const katOf = (id) => STATE.kategoriler.find((k) => k.id === id);
const host = (u) => { try { return new URL(u).hostname.replace('www.',''); } catch { return u; } };

function yildiz(n) {
  return `<span class="yildizlar">${'★'.repeat(n)}<span class="bos">${'☆'.repeat(5 - n)}</span></span>`;
}

async function refresh() {
  STATE = await call('/api/state');
  const c = STATE.config;
  $('#c-llm').textContent = c.llm;
  $('#c-dry').textContent = c.dryRun ? 'açık' : 'kapalı';
  $('#c-auto').textContent = c.autoApprove ? 'otomatik' : 'elle';
  renderAna();
  renderKategoriler();
  renderEkipler();
  renderHesapEkle();
}

/* ============================================================ ANA SAYFA */

function renderAna() {
  const el = $('#view-ana');
  if (!SECILI_HESAP) return renderHesapListesi(el);
  renderHesapSayfasi(el);
}

function renderHesapListesi(el) {
  if (!STATE.accounts.length) {
    el.innerHTML = `<div class="empty">Henüz hesap yok.<br><br><b>Hesap Ekle</b> sekmesinden bir platform bağla.</div>`;
    return;
  }
  el.innerHTML = `
    <div class="card">
      <h2>Bağlı hesaplar</h2>
      <div class="muted small">Bir hesaba tıkla, o platform için hazırlanmış post önerilerini gör.</div>
    </div>
    <div class="hesaplar">
      ${STATE.accounts.map((a) => {
        const postlar = STATE.posts.filter((p) => p.targets.includes(a.id));
        const oneri = postlar.filter((p) => p.status !== 'published' && p.status !== 'rejected').length;
        const yayin = postlar.filter((p) => p.status === 'published').length;
        const enIyi = Math.max(0, ...postlar.map((p) => (p.puan && p.puan.yildiz) || 0));
        return `<div class="hesap" data-hesap="${a.id}">
          <div class="ad">${esc(a.label)}</div>
          <div class="plat">${esc((platformOf(a.platform) || {}).label || a.platform)} · ${esc(a.verifiedAs || '')}</div>
          <div class="sayilar">
            <div><b>${oneri}</b>öneri</div>
            <div><b>${yayin}</b>yayında</div>
            <div><b>${enIyi || '—'}</b>en iyi ★</div>
          </div>
          ${a.enabled ? '' : '<div class="small" style="color:var(--bad);margin-top:8px">kapalı</div>'}
          ${a.manuel ? '<div style="margin-top:8px"><span class="rozet">manuel yayın</span></div>' : ''}
        </div>`;
      }).join('')}
    </div>`;
}

function renderHesapSayfasi(el) {
  const a = accountOf(SECILI_HESAP);
  if (!a) { SECILI_HESAP = null; return renderHesapListesi(el); }

  const hepsi = STATE.posts.filter((p) => p.targets.includes(a.id));
  const kategoriler = STATE.kategoriler.filter((k) => k.aktif);
  const secili = SECILI_KATEGORI ? hepsi.filter((p) => p.kategori === SECILI_KATEGORI) : hepsi;

  /* En yuksek yildiz en ustte: once en iyi oneri gorunsun. */
  const sirali = secili.slice().sort((x, y) => ((y.puan && y.puan.yildiz) || 0) - ((x.puan && x.puan.yildiz) || 0));

  /**
   * ACIK POST VARSA YALNIZ ONU GOSTER.
   *
   * Onceden butun postlar tam haliyle alt alta aciliyordu: metin kutusu,
   * alternatifler, gorseller, sekiz dugme... Ekranda hangi dugmenin hangi
   * posta ait oldugu okunmuyordu. Simdi liste yalnizca basliklari verir,
   * butun islemler tek postun detayinda toplanir.
   */
  if (SECILI_POST) {
    const p = STATE.posts.find((x) => x.id === SECILI_POST);
    if (p) { el.innerHTML = postDetay(p, a); return; }
    SECILI_POST = null;
  }

  el.innerHTML = `
    <button class="geri" id="geri">← bağlı hesaplar</button>
    <div class="card">
      <div class="row">
        <div class="grow">
          <h2>${esc(a.label)}</h2>
          <div class="muted small">${esc((platformOf(a.platform) || {}).label || a.platform)} · ${esc(a.verifiedAs || '')}</div>
        </div>
        ${SECILI_KATEGORI
          ? `<button class="primary" data-katuret="${SECILI_KATEGORI}">${esc((katOf(SECILI_KATEGORI) || {}).ad || '')} içeriği getir</button>`
          : `<button class="primary" data-hesapyaz="${a.id}">Tüm kategorilerden üret</button>`}
      </div>
      <label>Post kategorisi ${SECILI_KATEGORI ? '<span class="muted">— seçili kategoriden üretince yalnızca o kaynaklar çekilir</span>' : ''}</label>
      <div class="row">
        <button class="mini ${SECILI_KATEGORI ? '' : 'primary'}" data-katfiltre="">Tümü (${hepsi.length})</button>
        ${kategoriler.map((k) => {
          const n = hepsi.filter((p) => p.kategori === k.id).length;
          return `<button class="mini ${SECILI_KATEGORI === k.id ? 'primary' : ''}" data-katfiltre="${k.id}">${esc(k.ad)} (${n})</button>`;
        }).join('')}
      </div>
    </div>
    ${sirali.length
      ? `<div class="liste">${sirali.map(postSatiri).join('')}</div>`
      : `<div class="empty">Bu kategoride henüz öneri yok.<br><br>Yukarıdan <b>içerik getir</b>'e bas.</div>`}`;
}

/* ============================================================= ILERLEME */

/**
 * Uzun islerde gecen sureyi ve hangi adimda olundugunu gosterir.
 *
 * Sahte yukleme cubugu degil: adimlar sunucudan geliyor (core/ilerleme.ts).
 * Bir adim uzarsa kullanici nerede beklendigini gorur; "donmus mu"
 * sorusu ortadan kalkar.
 */
let ILERLEME_TIMER = null;

function sureYaz(ms) {
  const s = Math.floor(ms / 1000);
  return s < 60 ? `${s} sn` : `${Math.floor(s / 60)} dk ${String(s % 60).padStart(2, '0')} sn`;
}

function ilerlemeCiz(d) {
  const kutu = $('#ilerleme');
  if (!kutu) return;

  if (!d || (!d.calisiyor && !d.adimlar.length)) { kutu.hidden = true; return; }

  const gecen = d.baslangic ? Date.now() - d.baslangic : 0;
  const bitenAdet = d.adimlar.filter((a) => a.durum === 'bitti' || a.durum === 'hata').length;
  const yuzde = d.adimlar.length ? Math.round((bitenAdet / d.adimlar.length) * 100) : 0;

  const simge = (a) =>
    a.durum === 'bitti' ? '<span style="color:var(--ok)">✓</span>'
    : a.durum === 'hata' ? '<span style="color:var(--bad)">✕</span>'
    : a.durum === 'suruyor' ? '<span class="donen"></span>'
    : '<span class="muted">○</span>';

  kutu.hidden = false;
  kutu.innerHTML = `
    <div class="row">
      <b class="grow">${esc(d.baslik)}</b>
      <span class="sayac">${sureYaz(gecen)}</span>
    </div>
    <div class="cubuk ${d.calisiyor ? 'canli' : ''}"><div style="width:${yuzde}%"></div></div>
    <div class="adimlar">
      ${d.adimlar.map((a) => `<div class="adim ${a.durum}">
        <span class="simge">${simge(a)}</span>
        <span class="ad">${esc(a.ad)}</span>
        ${a.ozet ? `<span class="ozet muted small">${esc(a.ozet)}</span>` : ''}
        ${a.sure ? `<span class="muted small sure">${sureYaz(a.sure)}</span>` : ''}
      </div>`).join('')}
    </div>
    ${d.calisiyor
      ? '<div class="muted small" style="margin-top:8px">Çalışıyor — bu sayfayı kapatma, işlem sunucuda sürüyor.</div>'
      : '<div class="muted small" style="margin-top:8px">Bitti.</div>'}`;
}

/** Is basladiginda cagrilir; bitene kadar saniyede bir sunucuya sorar. */
function ilerlemeIzle() {
  if (ILERLEME_TIMER) clearInterval(ILERLEME_TIMER);

  /**
   * ILK SORGU ISTEN ONCE GIDIYOR.
   *
   * Dugmeye basildiginda once izleme baslatiliyor, POST ondan sonra
   * sunucuya ulasiyor. Ilk sorgu bu yuzden "calismiyor" cevabi aliyordu
   * ve izleyici daha is baslamadan kendini kapatiyordu - ilerleme kutusu
   * hic gorunmuyordu.
   *
   * Cozum: kapanma yalnizca is bir kez CALISIR gorulduyse olur. Is hic
   * baslamazsa (sunucu hatasi, istek reddedildi) bekleme sonsuz surmesin
   * diye bos tur sayaci var.
   */
  let calisirGoruldu = false;
  let bosTur = 0;

  const sor = async () => {
    try {
      const d = await call('/api/ilerleme');
      const aktif = d.calisiyor || d.busy;

      if (aktif) { calisirGoruldu = true; bosTur = 0; }
      else bosTur++;

      // Is baslamadan onceki bos turlarda eski turun ozetini gosterme.
      if (aktif || calisirGoruldu) ilerlemeCiz(d);

      if ((calisirGoruldu && !aktif) || (!calisirGoruldu && bosTur > 15)) {
        clearInterval(ILERLEME_TIMER);
        ILERLEME_TIMER = null;
      }
    } catch (e) {
      /* Sunucuya ulasilamiyorsa sayaci durdurma: is surerken ag hatasi
         gecici olabilir. Bir sonraki turda tekrar denenir. */
    }
  };

  sor();
  ILERLEME_TIMER = setInterval(sor, 1000);
}

/* ======================================================== HABER LISTESI */

/**
 * Tek satirlik ozet. Amaci karar verdirmek degil, SECTIRMEK:
 * hangi haber, ne kadar iyi, hangi asamada, medyasi var mi.
 * Detay icin tiklanir.
 */
function postSatiri(p) {
  const metin = Object.values(p.variants)[0] || '';
  const gorselAdet = p.media.filter((m) => m.kind === 'image').length;
  const videoVar = p.media.some((m) => m.kind === 'video');

  /* Medya durumu tek bakista okunsun: neyin uretildigi, neyin eksik oldugu. */
  const medya = videoVar
    ? `<span class="rozet ok">video + ${gorselAdet} görsel</span>`
    : gorselAdet
      ? `<span class="rozet ok">${gorselAdet} görsel</span>`
      : '<span class="rozet">medya yok</span>';

  const durum = !Object.keys(p.variants).length
    ? '<span class="rozet uyari">metin yok</span>'
    : '';

  return `<div class="satir" data-postac="${p.id}">
    <div class="yildizlar">${p.puan ? yildiz(p.puan.yildiz) : '<span class="muted small">—</span>'}</div>
    <div class="govde">
      <div class="baslik">${esc(p.topic)}</div>
      <div class="altbilgi">
        <span class="status s-${p.status}">${p.status}</span>
        ${p.kategori ? `<span class="chip">${esc((katOf(p.kategori) || {}).ad || p.kategori)}</span>` : ''}
        ${medya}
        ${durum}
        ${p.kaynak && p.kaynak.site ? `<span class="muted small">${esc(p.kaynak.site)}</span>` : ''}
      </div>
      ${metin ? `<div class="onizleme">${esc(metin.slice(0, 110))}${metin.length > 110 ? '…' : ''}</div>` : ''}
    </div>
    <div class="cevron">›</div>
  </div>`;
}
/* ============================================================ POST DETAYI */

/**
 * Bir postun her seyi: kaynak haber, puan, metin, alternatifler, medya ve
 * butun islemler. Ayni anda YALNIZ BIR post detayi acik olur; boylece
 * ekrandaki her dugmenin hangi habere ait oldugu tartismasizdir.
 */
function postDetay(p, acc) {
  const platformId = acc.platform || 'x';
  const lim = (platformOf(platformId) || {}).limits ? platformOf(platformId).limits.text : 500;
  const metin = p.variants[platformId] || Object.values(p.variants)[0] || '';
  /* Hesap manuel moddaysa "Yayınla" (API) kapali kalir; yol manuel pakettir. */
  const manuelHesap = Boolean(acc.manuel);

  const puanKutu = p.puan ? `
    <div class="puankutu">
      <div class="row">
        ${yildiz(p.puan.yildiz)}
        <span class="muted small grow">${esc(p.puan.gerekce)}</span>
        <button class="mini" data-puanla="${p.id}">yeniden puanla</button>
      </div>
      <div style="margin-top:6px">
        ${p.puan.sinyaller.map((s) => `<span class="sinyal ${s.etki > 0 ? 'arti' : s.etki < 0 ? 'eksi' : ''}">${s.etki > 0 ? '+' : ''}${s.etki} ${esc(s.aciklama)}</span>`).join('')}
      </div>
      ${p.puan.oneri ? `<div class="small" style="margin-top:8px;color:var(--warn)">Öneri: ${esc(p.puan.oneri)}</div>` : ''}
    </div>`
    : `<div class="row" style="margin:8px 0">
        <span class="muted small grow">henüz puanlanmadı</span>
        <button class="mini" data-puanla="${p.id}" ${metin ? '' : 'disabled'}>puanla</button>
      </div>`;

  const adaylar = (p.metinAdaylari || {})[platformId] || [];
  const metinAdaylari = adaylar.length ? `
    <div class="variant">
      <h4>Alternatif metinler (${adaylar.length})</h4>
      ${adaylar.map((ad, i) => `<div class="row" style="align-items:flex-start;margin-bottom:8px">
        ${ad.puan ? yildiz(ad.puan.yildiz) : '<span class="muted small">—</span>'}
        <div class="grow small">${esc(ad.metin)}</div>
        <button class="mini" data-metinsec="${p.id}" data-mplat="${platformId}" data-mindex="${i}">bunu kullan</button>
      </div>`).join('')}
    </div>` : '';

  const gorseller = p.media.filter((m) => m.kind === 'image');
  const videolar = p.media.filter((m) => m.kind === 'video');

  const medyaKutu = p.media.length ? `
    <div class="variant">
      <h4>Medya — ${gorseller.length} görsel${videolar.length ? ' + video' : ''}</h4>
      <div class="row" style="flex-wrap:wrap;align-items:flex-start">
        ${p.media.map((m) => {
          const src = `/media/${encodeURIComponent(m.path.split('/').pop())}`;
          return m.kind === 'video'
            ? `<video class="preview" src="${src}" controls preload="metadata"></video>`
            : `<img class="preview" src="${src}" alt="">`;
        }).join('')}
      </div>
    </div>`
    : '<div class="small" style="color:var(--warn);margin-top:10px">Henüz medya yok — aşağıdan <b>Görsel üret</b> ya da <b>Video üret</b>.</div>';

  const sonuc = p.results.length
    ? `<div class="variant"><h4>Geçmiş</h4><div class="small muted">` + p.results.map((r) =>
        `${r.ok ? '✓' : '✗'} ${esc((accountOf(r.accountId) || {}).label || r.platform)}${r.manuel ? ' · elle paylaşıldı' : ''}${r.url ? ' · ' + esc(r.url) : ''}${r.error ? ' · ' + esc(r.error.slice(0, 160)) : ''}`
      ).join('<br>') + `</div></div>`
    : '';

  return `
    <button class="geri" data-postgeri="1">← haber listesi</button>

    <div class="card">
      <div class="row">
        <span class="status s-${p.status}">${p.status}</span>
        ${p.kategori ? `<span class="chip">${esc((katOf(p.kategori) || {}).ad || p.kategori)}</span>` : ''}
        <span class="grow"></span>
        <span class="muted small">${p.id}</span>
      </div>
      <h2 style="margin:8px 0 4px">${esc(p.topic)}</h2>
      ${p.angle ? `<div class="muted small">açı: ${esc(p.angle)}</div>` : ''}
      ${p.kaynak && p.kaynak.ozet ? `<details style="margin-top:10px">
        <summary class="muted small" style="cursor:pointer">kaynak haber${p.kaynak.site ? ' · ' + esc(p.kaynak.site) : ''}</summary>
        <div class="small muted" style="margin-top:6px;padding:8px;background:var(--bg);border-radius:8px">
          ${esc(p.kaynak.ozet)}
          ${p.kaynak.url ? `<br><a href="${esc(p.kaynak.url)}" target="_blank" rel="noreferrer">habere git →</a>` : ''}
        </div></details>` : ''}
      ${puanKutu}
    </div>

    <div class="card">
      <div class="row"><b class="grow">Metin</b>
        <button class="mini" data-yaz="${p.id}">${metin ? 'yeniden yaz' : 'metin yaz'}</button>
      </div>
      ${metin
        ? `<div class="variant">
            <h4>${esc((platformOf(platformId) || {}).label || platformId)} · ${metin.length}/${lim}</h4>
            <textarea data-text="${p.id}" data-platform="${platformId}">${esc(metin)}</textarea>
          </div>`
        : `<div class="small" style="color:var(--warn);margin-top:8px">Metin yazılmadı — yukarıdan <b>metin yaz</b>'a bas.</div>`}
      ${metinAdaylari}
    </div>

    <div class="card">
      <div class="row">
        <b class="grow">Medya</b>
        <button class="mini primary" data-uret="${p.id}" data-tur="gorsel" ${p.script ? '' : 'disabled'}>Görsel üret</button>
        <button class="mini primary" data-uret="${p.id}" data-tur="video" ${p.script ? '' : 'disabled'}>Video üret</button>
        <button class="mini" data-gorselara="${p.id}">Web'de görsel ara</button>
      </div>
      <div class="muted small" style="margin-top:6px">
        Görsel üret: en az 2 görsel · Video üret: en az 3 kare + seslendirme + altyazı
        ${p.script ? '' : ' — <b>önce metin yazılmalı</b>'}
      </div>
      ${medyaKutu}
      <div class="adaylar" id="adaylar-${p.id}" hidden></div>
    </div>

    <div class="card">
      <div class="row">
        <button class="ok" data-decide="approved" data-id="${p.id}" ${metin ? '' : 'disabled'}>Onayla</button>
        <button class="bad" data-decide="rejected" data-id="${p.id}">Reddet</button>
        <button data-yayinla="${p.id}" ${p.status === 'approved' && !manuelHesap ? '' : 'disabled'}>Yayınla (API)</button>
        <button class="primary" data-manuel="${p.id}" ${metin ? '' : 'disabled'}>Manuel yayınla</button>
        <span class="grow"></span>
        <button data-del="${p.id}" class="bad" style="opacity:.7">Sil</button>
      </div>
      ${manuelHesap ? '<div class="muted small" style="margin-top:8px">Bu hesap manuel modda — API ile yayın kapalı, <b>Manuel yayınla</b> ile paylaş.</div>' : ''}
      <div class="manuel" id="manuel-${p.id}" hidden></div>
    </div>

    ${sonuc}`;
}

/* ======================================================= MANUEL YAYIN */
/*
 * Ucretli API'ye baglanmadan paylasim. Sistem her seyi hazirlar, son adimi
 * kullanici atar. Sunucu tarafi: src/allagents/manuel.ts
 */
function manuelKutu(k) {
  const medya = k.medya.map((m) => m.kind === 'video'
    ? `<video class="preview" src="${m.url}" controls preload="metadata"></video>`
    : `<img class="preview" src="${m.url}" alt="">`).join('');

  const indir = k.medya.map((m) =>
    `<a class="btn" href="${m.url}" download="${esc(m.dosya)}">${m.kind === 'video' ? 'Videoyu' : 'Görseli'} indir</a>`
  ).join('');

  return `
    <div class="row">
      <b class="grow">Manuel paylaşım — ${esc(k.hesapAdi)} · ${esc(k.platformAdi)}</b>
      <span class="muted small">${k.karakter}/${k.limit}</span>
    </div>
    <textarea id="mmetin-${k.postId}" rows="4" readonly>${esc(k.metin)}</textarea>
    <div class="row" style="margin-top:8px;flex-wrap:wrap">
      <button class="mini primary" data-kopyala="${k.postId}">Metni kopyala</button>
      ${k.paylasLinki ? `<a class="btn" href="${esc(k.paylasLinki)}" target="_blank" rel="noreferrer">Paylaşım ekranını aç →</a>` : ''}
      ${indir}
    </div>
    ${medya}
    <ol class="small">${k.adimlar.map((a) => `<li>${esc(a)}</li>`).join('')}</ol>
    <div class="row" style="margin-top:12px">
      <input id="murl-${k.postId}" class="grow" placeholder="paylaştığın gönderinin linki — isteğe bağlı">
      <button class="ok" data-paylastim="${k.postId}" data-macc="${esc(k.accountId)}">Paylaştım</button>
    </div>
    ${k.paylasildi ? '<div class="small" style="color:var(--ok);margin-top:8px">Bu hesapta zaten paylaşıldı olarak işaretli.</div>' : ''}`;
}

async function gorselAra(id, sorgu) {
  const kutu = $(`#adaylar-${id}`);
  const kaynaklar = [].slice.call(document.querySelectorAll(`[data-kaynak="${id}"]:checked`)).map((c) => c.value);
  try {
    const r = await call('/api/post/gorsel-ara', { id, sorgu, kaynaklar: kaynaklar.length ? kaynaklar : ['openverse'] });
    kutu.innerHTML = `
      <div class="ust">
        <input id="sorgu-${id}" value="${esc(r.terim)}" placeholder="arama terimi">
        <button class="mini" data-arabuton="${id}">Ara</button>
        <label style="margin:0;display:flex;gap:5px;align-items:center;color:var(--ink)">
          <input type="checkbox" data-kaynak="${id}" value="openverse" checked style="width:auto"> foto</label>
        <label style="margin:0;display:flex;gap:5px;align-items:center;color:var(--ink)">
          <input type="checkbox" data-kaynak="${id}" value="imgflip" style="width:auto"> mizah</label>
      </div>
      ${r.adaylar.length ? `<div class="izgara">${r.adaylar.map((a) => `
        <div class="aday" data-secaday="${encodeURIComponent(JSON.stringify(a))}" title="tıkla ve kullan">
          <img src="${esc(a.thumb)}" loading="lazy" alt="">
          <div class="bilgi"><b>${esc(a.kaynak)}</b><br>${esc((a.baslik || '').slice(0, 42))}</div>
        </div>`).join('')}</div>`
        : '<div class="muted small">sonuç yok — terimi değiştir</div>'}`;
  } catch (e) {
    kutu.innerHTML = `<div class="small" style="color:var(--bad)">hata: ${esc(e.message)}</div>`;

}

/* =============================================================== OLAYLAR */

function sekmeGec(which) {
  ['ana', 'kategoriler', 'ekipler', 'hesaplar'].forEach((n) => {
    $(`#tab-${n}`).setAttribute('aria-selected', n === which);
    $(`#view-${n}`).hidden = n !== which;
  });
}

document.addEventListener('click', async (e) => {
  /* Haber satirina tiklandi: detayi ac. Satirin icindeki dugmeler haric. */
  const satir = e.target.closest('[data-postac]');
  if (satir && !e.target.closest('button')) {
    SECILI_POST = satir.dataset.postac;
    MANUEL_ACIK = false;
    window.scrollTo(0, 0);
    return renderAna();
  }

  const hesapKart = e.target.closest('[data-hesap]');
  if (hesapKart) {
    SECILI_HESAP = hesapKart.dataset.hesap;
    SECILI_KATEGORI = null;
    SECILI_POST = null;
    return renderAna();
  }

  const t = e.target.closest('button');
  if (!t) return;

  /**
   * Uzun suren islerin ortak sarmalayicisi.
   * Video uretimi 1-2 dakika suruyor; bu sirada otomatik yenileme sayfayi
   * yeniden cizip dugmeyi sifirlamamali - URETIM_ACIK onu durduruyor.
   */
  const isle = async (yol, govde, dugme, bilgi) => {
    dugme.disabled = true;
    const eski = dugme.textContent;
    dugme.textContent = '…';
    URETIM_ACIK = true;
    ilerlemeIzle();
    if (bilgi) toast(bilgi, 6000);
    try {
      toast((await call(yol, govde)).message || 'tamam');
      URETIM_ACIK = false;
      await refresh();
    } catch (e) {
      URETIM_ACIK = false;
      throw e;
    } finally {
      URETIM_ACIK = false;
      dugme.disabled = false;
      dugme.textContent = eski;
    }
  };

  try {
    if (t.id === 'logo') { SECILI_HESAP = null; SECILI_KATEGORI = null; SECILI_POST = null; sekmeGec('ana'); return renderAna(); }
    if (t.id === 'geri') { SECILI_HESAP = null; SECILI_POST = null; return renderAna(); }
    if (t.id && t.id.indexOf('tab-') === 0) return sekmeGec(t.id.slice(4));

    if (t.dataset.katfiltre !== undefined) {
      SECILI_KATEGORI = t.dataset.katfiltre || null;
      return renderAna();
    }

    if (t.dataset.katuret) {
      // Yalnizca secili kategori: digerlerinin kaynaklarina hic gidilmez.
      t.disabled = true;
      const eski = t.textContent;
      t.textContent = 'üretiliyor…';
      /* Ilerleme kutusu adimlari ve gecen sureyi gosterir; is bitene kadar
         otomatik yenileme durur, yoksa sayfa yeniden cizilip kutu kayboluyor. */
      URETIM_ACIK = true;
      ilerlemeIzle();
      try {
        toast((await call('/api/kategoriden-uret', { kategori: t.dataset.katuret })).message, 8000);
        URETIM_ACIK = false;
        await refresh();
      } finally {
        URETIM_ACIK = false;
        t.disabled = false;
        t.textContent = eski;
      }
      return;
    }

    if (t.dataset.stage || t.dataset.hesapyaz) {
      const stage = t.dataset.stage || 'run';
      const hepsi = [].slice.call(document.querySelectorAll('header button'));
      hepsi.forEach((b) => (b.disabled = true));
      t.disabled = true;
      URETIM_ACIK = true;
      ilerlemeIzle();
      try { toast((await call('/api/run', { stage })).message, 6000); }
      finally {
        URETIM_ACIK = false;
        hepsi.forEach((b) => (b.disabled = false));
        t.disabled = false;
      }
      return refresh();
    }

    if (t.dataset.postgeri) { SECILI_POST = null; MANUEL_ACIK = false; window.scrollTo(0, 0); return renderAna(); }

    /* Tek dugme: tercihi de uretimi de yapar. Ne uretecegi dugmenin uzerinde yazili. */
    if (t.dataset.uret) {
      const video = t.dataset.tur === 'video';
      return isle(
        '/api/post/uret',
        { id: t.dataset.uret, tur: t.dataset.tur },
        t,
        video
          ? 'Video üretiliyor: görseller toplanıyor, seslendirme yapılıyor, montaj alınıyor… 1-2 dakika sürer.'
          : 'Görseller toplanıyor…',
      );
    }

    if (t.dataset.yaz) return isle('/api/post/yaz', { id: t.dataset.yaz }, t);
    if (t.dataset.puanla) return isle('/api/post/puanla', { id: t.dataset.puanla }, t);
    if (t.dataset.yayinla) return isle('/api/run', { stage: 'publish' }, t);

    /* --- manuel yayin --- */
    if (t.dataset.manuel) {
      const id = t.dataset.manuel;
      const kutu = $(`#manuel-${id}`);
      if (!kutu.hidden) { kutu.hidden = true; MANUEL_ACIK = false; return; }
      kutu.hidden = false;
      MANUEL_ACIK = true;
      kutu.innerHTML = '<div class="muted small">paket hazırlanıyor…</div>';
      try {
        kutu.innerHTML = manuelKutu((await call('/api/post/manuel', { id })).paket);
      } catch (e) {
        kutu.innerHTML = `<div class="small" style="color:var(--bad)">${esc(e.message)}</div>`;
      }
      return;
    }

    if (t.dataset.kopyala) {
      const ta = $(`#mmetin-${t.dataset.kopyala}`);
      try {
        await navigator.clipboard.writeText(ta.value);
      } catch (e) {
        /* clipboard izni yoksa eski yontem; her tarayicida calisir. */
        ta.removeAttribute('readonly'); ta.select(); document.execCommand('copy');
        ta.setAttribute('readonly', '');
      }
      toast('metin kopyalandı');
      return;
    }

    if (t.dataset.paylastim) {
      const id = t.dataset.paylastim;
      const url = ($(`#murl-${id}`) || {}).value || '';
      toast((await call('/api/post/manuel-isaretle', { id, accountId: t.dataset.macc, url })).message);
      MANUEL_ACIK = false;
      return refresh();
    }

    if (t.dataset.metinsec) {
      await call('/api/post/metin-sec', {
        id: t.dataset.metinsec, platform: t.dataset.mplat, index: Number(t.dataset.mindex),
      });
      toast('metin değiştirildi');
      return refresh();
    }

    if (t.dataset.gorselara) {
      const id = t.dataset.gorselara;
      const kutu = $(`#adaylar-${id}`);
      if (kutu.hasAttribute('data-acik')) { kutu.removeAttribute('data-acik'); kutu.hidden = true; return; }
      kutu.hidden = false;
      kutu.setAttribute('data-acik', '1');
      kutu.innerHTML = '<div class="muted small">aranıyor…</div>';
      return gorselAra(id, '');
    }
    if (t.dataset.arabuton) return gorselAra(t.dataset.arabuton, $(`#sorgu-${t.dataset.arabuton}`).value);

    if (t.dataset.secaday) {
      const kutu = t.closest('.adaylar');
      const aday = JSON.parse(decodeURIComponent(t.dataset.secaday));
      kutu.innerHTML = '<div class="muted small">indiriliyor…</div>';
      toast((await call('/api/post/gorsel-sec', { id: kutu.id.replace('adaylar-', ''), aday })).message);
      return refresh();
    }

    if (t.dataset.decide) { await call('/api/decide', { id: t.dataset.id, decision: t.dataset.decide }); return refresh(); }
    if (t.dataset.del) { await call('/api/post/delete', { id: t.dataset.del }); SECILI_POST = null; toast('silindi'); return refresh(); }
    if (t.dataset.verify) { toast('bağlantı iyi: ' + (await call('/api/account/verify', { id: t.dataset.verify })).verifiedAs); return refresh(); }
    if (t.dataset.toggle) { await call('/api/account/toggle', { id: t.dataset.toggle }); return refresh(); }
    if (t.dataset.mmod) { toast((await call('/api/account/manuel', { id: t.dataset.mmod })).message, 6000); return refresh(); }
    if (t.dataset.rm) { if (!confirm('Hesap silinsin mi?')) return; await call('/api/account/delete', { id: t.dataset.rm }); return refresh(); }

    if (t.dataset.kkaydet) {
      const id = t.dataset.kkaydet;
      const k = STATE.kategoriler.find((x) => x.id === id);
      await call('/api/kategori/kaydet', Object.assign({}, k, {
        yonerge: $(`[data-kyonerge="${id}"]`).value,
        medya: $(`[data-kmedya="${id}"]`).value,
        agirlik: Number($(`[data-kagirlik="${id}"]`).value) || 1,
      }));
      toast('kaydedildi');
      return refresh();
    }
    if (t.dataset.ktoggle) {
      const k = STATE.kategoriler.find((x) => x.id === t.dataset.ktoggle);
      await call('/api/kategori/kaydet', Object.assign({}, k, { aktif: !k.aktif }));
      return refresh();
    }
    if (t.dataset.ksil) { await call('/api/kategori/sil', { id: t.dataset.ksil }); toast('silindi'); return refresh(); }

    if (t.id === 'save-account') {
      const def = platformOf($('#new-platform').value);
      const credentials = {};
      def.fields.forEach((f) => { credentials[f.key] = $(`[data-f="${f.key}"]`).value.trim(); });
      t.disabled = true;
      try {
        await call('/api/account/save', { platform: def.id, label: $('#f-label').value, credentials });
        toast('hesap eklendi ve doğrulandı');
        await refresh();
      } finally { t.disabled = false; }
    }
  } catch (err) {
    toast('hata: ' + err.message, 6000);
  }
});

document.addEventListener('change', async (e) => {
  const el = e.target;
  try {
    if (el.dataset.text) {
      await call('/api/post/text', { id: el.dataset.text, platform: el.dataset.platform, text: el.value });
      toast('metin kaydedildi');
    }
  } catch (err) {
    toast('hata: ' + err.message, 6000);
  }
});

/* Yazarken yenileme yapma: form alanlarini sifirliyordu. */
function formMesgul() {
  const el = document.activeElement;
  return Boolean(el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName));
}
/*
 * MANUEL_ACIK: manuel paket acikken otomatik yenileme kutuyu silerdi.
 * Kullanici metni kopyalayip X'e gecerken paketin yerinde durmasi sart.
 */
let MANUEL_ACIK = false;
/* Uretim surerken sayfa yenilenmez: dugme sifirlanir, ilerleme kaybolur. */
let URETIM_ACIK = false;
setInterval(() => {
  if (!document.hidden && !formMesgul() && !MANUEL_ACIK && !URETIM_ACIK) refresh().catch(() => {});
}, 20000);

refresh().catch((e) => toast('yüklenemedi: ' + e.message, 8000));
</script>
</body>
</html>
